services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rent-ledger:latest
    container_name: rent-ledger
    restart: unless-stopped
    ports:
      - "8006:8000"
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - JWT_SECRET=${JWT_SECRET:?must be set -- generate one with: openssl rand -hex 32}
      - JWT_EXPIRY_HOURS=336
      - ADMIN_USERNAME=${ADMIN_USERNAME:?must be set -- the landlord's login username}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?must be set -- the landlord's login password}
      - SERVE_STATIC=true
      - PORT=8000
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
    driver: local
  uploads_data:
    driver: local
